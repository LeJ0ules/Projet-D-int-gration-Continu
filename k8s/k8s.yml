name: CI-K8s
on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - run: docker build -t data-pipeline:ci .
      - run: kind load docker-image data-pipeline:ci --name ci
      - run: kubectl apply -f k8s/postgres/ -f k8s/s3/
      - run: kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s
      - run: kubectl apply -f k8s/job.yaml
      - run: kubectl wait --for=condition=complete job/pipeline --timeout=180s
      - run: kubectl logs job/pipeline
        if: always()