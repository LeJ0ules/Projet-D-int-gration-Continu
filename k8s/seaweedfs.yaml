apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          # À figer sur une version précise (ex. 4.xx) une fois la CD validée.
          image: chrislusf/seaweedfs:4.53
          args:
            - mini
            - -dir=/data
            - -s3.config=/config/s3/s3config.json
            - -bucket=transactions
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            # Identifiants S3 : fichier JSON fourni par un Secret (créé par le workflow CD).
            - name: s3-config
              mountPath: /config/s3
              readOnly: true
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
