name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Conteneur Postgres démarré à côté du job, accessible sur localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pipeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/pipeline
      S3_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY: testkey
      S3_SECRET_KEY: testsecret
      S3_BUCKET: transactions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires
        run: pytest tests/unit

      # Un "service" GitHub ne permet pas de passer une commande au conteneur :
      # on lance donc SeaweedFS avec docker run, puis on attend que l'API S3 réponde.
      - name: Démarrer le S3 local (SeaweedFS)
        run: |
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"testkey","secretKey":"testsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > s3config.json
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/s3config.json:/etc/seaweedfs/s3config.json:ro" \
            chrislusf/seaweedfs:4.53 \
            mini -dir=/data -s3.config=/etc/seaweedfs/s3config.json -bucket=transactions
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8333 && echo "S3 prêt" && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      - name: Lancer la pipeline (génération, S3, traitement, insertion)
        run: python -m src.pipeline

      - name: Tests d'intégration (valeurs en base, S3)
        run: pytest tests/integration

      - name: Logs du S3 en cas d'échec
        if: failure()
        run: docker logs seaweedfs || true

      - name: Build de l'image Docker
        run: docker build -t data-pipeline:ci .
